<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Lab1</title></head>
<body>
<h1>Day la Lab1 - ngaymaiconang.id.vn</h1>
<button onclick="goiAPI()">Goi API</button>
<div id="ketqua"></div>
<script>
function goiAPI() {
  fetch('/api/tacke')
    .then(res => res.json())
    .then(data => {
      let html = '<table border="1"><tr><th>Ten</th><th>So tien</th></tr>';
      data.dssv.forEach(sv => {
        html += `<tr><td>${sv.name}</td><td>${sv.money}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('ketqua').innerHTML = html;
    })
    .catch(err => { document.getElementById('ketqua').innerHTML = 'Loi: ' + err; });
}
</script>
</body>
</html>
